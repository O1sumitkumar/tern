[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.99"
repository = "https://github.com/your-moon/tern"

[workspace.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }
tern-ssh = { path = "crates/tern-ssh", version = "0.1.3" }
tern-sync = { path = "crates/tern-sync", version = "0.1.3" }
tern-term = { path = "crates/tern-term", version = "0.1.3" }
tern-vault = { path = "crates/tern-vault", version = "0.1.3" }
# Wallpaper decoding; the same 0.25 gpui renders with, so no second copy is built.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
# Exact pin: russh pins the same pre-release, so tern-vault shares its copy.
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["ed25519", "std"] }
rand = { version = "0.10", features = ["thread_rng"] }
security-framework = "3"
keyring = { version = "3", default-features = false }

russh-sftp = "3.0.1"
# Local-time dates in the file browser.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Craft gates. Every crate opts in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
large_futures = "warn"
needless_pass_by_value = "warn"
# Rust API Guidelines C-FAILURE: every public fallible fn documents its errors.
missing_errors_doc = "warn"
disallowed_methods = "deny"

# Small, fast release binary. Measured, not assumed: see docs/perf.md.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false
incremental = false

[profile.dev.package."*"]
opt-level = 2   # deps optimised even in dev, so the terminal is usable while developing
