[package]
name = "tern-vault"
description = "Passphrase-encrypted store for tern's SSH secrets (age, scrypt)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
age = "0.11"
rand.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh-key.workspace = true
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"

[lints]
workspace = true
